<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MansaPay</title>
    <script>
      // Resolves the theme and stamps it on <html> before first paint, so
      // there is no flash of the wrong theme while React and index.css load.
      // Kept in sync with src/context/ThemeContext.tsx by hand - this has to
      // run synchronously and inline, before the module script below.
      (function () {
        try {
          var stored = localStorage.getItem('mansapay-theme');
          var pref = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var resolved =
            pref === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : pref;
          document.documentElement.dataset.theme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <style>
      /* Matches the resolved theme so there is no background flash before
         index.css loads. */
      html {
        background-color: #0a0a0d;
      }
      html[data-theme='light'] {
        background-color: #f7f5f0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
